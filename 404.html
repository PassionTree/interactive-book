<script>
  // NoC Book pages used to live at the site root; forward old links to nocbook/
  (function () {
    var BASE = '/nocbook/';
    var m = location.pathname.match(/^(.*\/)((?:0\d-[a-z-]+|10-appendix)\.html)$/);
    if (m && m[1] === BASE) location.replace(BASE + 'nocbook/' + m[2] + location.hash);
  })();
</script>
