<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없음 — NoC Book · LinkBook</title>
<script>
  // NoC Book pages used to live at the site root; forward old links to nocbook/
  (function () {
    // project-site base path, e.g. /interactive-book/ (works whatever the repository is named)
    var BASE = '/' + location.pathname.split('/')[1] + '/';
    var m = location.pathname.match(/^(.*\/)((?:0\d-[a-z-]+|10-appendix)\.html)$/);
    if (m && m[1] === BASE) location.replace(BASE + 'nocbook/' + m[2] + location.hash);
  })();
</script>
<style>
  body { font-family: "Noto Sans KR", system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #fbfaf7; color: #1d1d1f; }
  @media (prefers-color-scheme: dark) { body { background: #15161a; color: #ececf1; } a { color: #7c96ff; } }
  main { text-align: center; padding: 24px; }
  a { color: #3b5bdb; margin: 0 10px; }
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p>페이지를 찾을 수 없습니다.</p>
  <p id="nav"><a href="./">홈</a> <a href="./nocbook/">NoC Book</a> <a href="./linkbook/">LinkBook</a></p>
  <script>
    (function () {
      var base = '/' + location.pathname.split('/')[1] + '/';
      var a = document.querySelectorAll('#nav a');
      a[0].href = base; a[1].href = base + 'nocbook/'; a[2].href = base + 'linkbook/';
    })();
  </script>
</main>
</body>
</html>
